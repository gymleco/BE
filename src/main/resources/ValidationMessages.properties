# Bean Validation 기본 문구를 한글로 바꾼다.
#
# ★ 애너테이션마다 message= 를 다는 대신 여기서 한 번에 잡는 이유
#   제약이 60곳 가까이 있는데 그때마다 문구를 적으면 표현이 제각각이 되고,
#   빠뜨린 한 곳에서만 "must not be blank" 가 튀어나온다.
#   칸 이름은 응답의 fields 키가 알려주므로 기본 문구는 일반적이어도 된다.
#   말이 달라져야 읽히는 칸에만 애너테이션에 message= 를 따로 단다.
#
# ★ 인코딩
#   Java 9 부터 PropertyResourceBundle 이 이 파일을 UTF-8 로 읽는다.
#   (실패하면 ISO-8859-1 로 물러선다) 그래서 유니코드 이스케이프가 필요 없다.
#
# {min} {max} {value} 는 애너테이션에 적은 값으로 치환된다.

jakarta.validation.constraints.NotNull.message          = 필수 항목입니다.
jakarta.validation.constraints.NotBlank.message         = 필수 입력 항목입니다.
jakarta.validation.constraints.NotEmpty.message         = 하나 이상 선택해 주세요.
jakarta.validation.constraints.Size.message             = {min}~{max}자로 입력해 주세요.
jakarta.validation.constraints.Positive.message         = 0보다 큰 값을 입력해 주세요.
jakarta.validation.constraints.PositiveOrZero.message   = 0 이상의 값을 입력해 주세요.
jakarta.validation.constraints.Min.message              = {value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message              = {value} 이하여야 합니다.
jakarta.validation.constraints.Digits.message           = 정수 {integer}자리, 소수점 아래 {fraction}자리까지 입력할 수 있습니다.
jakarta.validation.constraints.Email.message            = 이메일 형식이 올바르지 않습니다.
jakarta.validation.constraints.Pattern.message          = 형식이 올바르지 않습니다.
jakarta.validation.constraints.Past.message             = 지난 날짜여야 합니다.
jakarta.validation.constraints.Future.message           = 앞으로의 날짜여야 합니다.
jakarta.validation.constraints.AssertTrue.message       = 동의가 필요합니다.

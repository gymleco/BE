# ══════════════════════════════════════════════════════════════
#  로컬 개발 스택
#
#  실행:  docker compose --env-file .env up -d
#  중지:  docker compose down          (데이터 유지)
#         docker compose down -v       (데이터까지 삭제)
#
#  ⚠️ 이 파일은 로컬 전용이다. 운영에서는 DB 포트를 호스트에 열지 않는다.
# ══════════════════════════════════════════════════════════════

name: gymleco

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymleco}
      # 슈퍼유저. 앱은 이 계정을 쓰지 않는다 — 아래 init 스크립트가
      # 권한을 제한한 앱 전용 계정을 따로 만든다 (기획서 §12).
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-gymleco_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: Asia/Seoul
    ports:
      # 로컬에서 DBeaver 등으로 붙기 위한 것. 운영에는 두지 않는다.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-gymleco}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gymleco}
      POSTGRES_USER: ${POSTGRES_USER:-gymleco_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      REVALIDATE_URL: ${REVALIDATE_URL:-}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"
      # 액추에이터는 내부 전용. 로컬에서만 열어 본다.
      - "127.0.0.1:8081:8081"

volumes:
  db-data:

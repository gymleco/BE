name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 시크릿 스캔 ───────────────────────────────────────────────
  secrets:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── 빌드 + 테스트 ─────────────────────────────────────────────
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: 빌드
        run: gradle --no-daemon build

  # ── 마이그레이션 SQL 검증 ─────────────────────────────────────
  # 실제 PostgreSQL 에 적용해 본다.
  # 문법 오류·제약 충돌이 배포 시점이 아니라 PR 시점에 드러나게 한다.
  migration:
    name: 마이그레이션 적용 검증
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymleco_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: 순서대로 적용
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V); do
            echo "── $f"
            psql -h localhost -U postgres -d gymleco_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # 적용됐다는 것과 막아준다는 것은 다르다.
      # 보안상 중요한 제약이 실제로 거부하는지 확인한다.
      - name: 제약이 실제로 막는지 확인
        env:
          PGPASSWORD: postgres
        run: |
          reject() {
            if psql -h localhost -U postgres -d gymleco_ci -v ON_ERROR_STOP=1 -q \
                 -c "$2" >/dev/null 2>&1; then
              echo "::error::$1 — 거부되어야 하는데 통과했습니다"
              exit 1
            fi
            echo "  OK  $1 → 거부됨"
          }

          reject "MD5 비밀번호 해시" \
            "INSERT INTO admin_user(username,password_hash) VALUES('t1','5f4dcc3b5aa765d61d8327deb882cf99')"
          reject "평문 비밀번호" \
            "INSERT INTO admin_user(username,password_hash) VALUES('t2','password1234')"
          reject "동의 없는 문의 저장" \
            "INSERT INTO inquiry(type,name,phone_encrypted,purge_at) VALUES('QUOTE','x','e',now())"
          reject "파기일이 동의일보다 이전" \
            "INSERT INTO inquiry(type,name,phone_encrypted,consent_at,purge_at) VALUES('QUOTE','x','e',now(),now()-interval '1 day')"
          reject "발행일 없이 소식 공개" \
            "INSERT INTO news(slug,title,visible) VALUES('t3','제목',TRUE)"

          echo "제약 검증 완료"

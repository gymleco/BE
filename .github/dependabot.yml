# 의존성 취약점 점검을 자동화한다 (기획서 §13 — 월 1회 점검 항목).
# 사람이 기억해서 하는 일은 결국 안 하게 된다.

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
